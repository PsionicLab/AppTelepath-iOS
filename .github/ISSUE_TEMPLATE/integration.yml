name: Integration problem
description: The SDK does not install, build, start, or connect.
labels: ["integration"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste workspace keys, captured traffic, screenshots, or other private data.** Redact first — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Xcode / iOS version
      placeholder: "Xcode 16.2, iOS 18.3 device"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Include the exact error text where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
